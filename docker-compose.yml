name: manjui-hehe
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: manju
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manju_local}
      POSTGRES_DB: manju
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manju -d manju"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
  minio:
    build: ./infra/minio
    image: manjui-hehe-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-manju_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-manju_local_secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  storage-init:
    build: ./backend
    env_file: .env
    depends_on: [minio]
    command: python -m app.providers.initialize
  api:
    build: ./backend
    volumes: ["./workflows:/workflows:ro"]
    env_file: .env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    volumes: ["./workflows:/workflows:ro"]
    env_file: .env
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    depends_on:
      api: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  minio_data:
